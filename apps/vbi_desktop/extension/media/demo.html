<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VBI Chart View</title>
    <style>
      /* 极简样式：消除所有边距，让图表接管整个 Webview */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--vscode-editor-background);
        color: var(--vscode-editor-foreground);
      }
      #chart-container {
        width: 100vw;
        height: 100vh;
      }
      #error-log {
        position: absolute;
        top: 10px;
        left: 10px;
        color: red;
        font-family: monospace;
        z-index: 999;
        pointer-events: none;
        white-space: pre-wrap;
      }
    </style>
    <script src="https://unpkg.com/@visactor/vchart/build/index.min.js"></script>
  </head>
  <body>
    <div id="chart-container">Loading VChart...</div>
    <div id="error-log"></div>

    <script>
      const vscode = acquireVsCodeApi()
      const errorLog = document.getElementById('error-log')

      window.addEventListener('error', function (e) {
        errorLog.innerText += e.message + '\n'
      })

      let vchartInstance = null

      window.addEventListener('message', (event) => {
        const message = event.data
        if (message.command === 'renderChart') {
          document.getElementById('chart-container').innerText = '' // clear loading
          try {
            const spec = message.data
            if (vchartInstance) {
              vchartInstance.release()
              vchartInstance = null
            }
            const ChartConstructor = window.VChart && window.VChart.default ? window.VChart.default : window.VChart
            if (!ChartConstructor) {
              throw new Error('VChart is not loaded from CDN')
            }
            vchartInstance = new ChartConstructor(spec, { dom: 'chart-container' })
            vchartInstance.renderAsync().catch((err) => {
              errorLog.innerText += 'Render error: ' + err.message + '\n'
            })
          } catch (err) {
            errorLog.innerText += 'Code error: ' + err.message + '\n'
          }
        }
      })

      // 告诉 Extension 前端已经准备就绪
      vscode.postMessage({ command: 'ready' })
    </script>
  </body>
</html>
